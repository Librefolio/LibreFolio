name: LibreFolio Release
# Release runs keep "Release vX.Y.Z"; nightlies and manual runs say what they are
# instead of a bare "Release " with an empty tag.
run-name: ${{ github.event_name == 'release' && format('Release {0}', github.event.release.tag_name) || (github.event_name == 'workflow_dispatch' && format('Manual run ({0})', github.ref_name) || format('Nightly ({0})', github.ref_name)) }}

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  release:
    types: [published]



permissions:
  contents: write     # Required to push to the gh-pages branch with mkdocs gh-deploy
  packages: write     # Required to push images to GHCR

jobs:
  release-pipeline:
    name: Full Release Pipeline
    runs-on: ubuntu-latest
    steps:
      # ==========================================
      # 1. BASE SETUP (Checkout & Environments)
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Required for mkdocs gh-deploy (history and branches)

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          
      - name: Install Pipenv
        run: pip install pipenv

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      # ==========================================
      # 2. CACHES
      # ==========================================
      # ubuntu-latest moves from 24.04 to 26.04 (actions/runner-images#14748), and
      # runner.os is "Linux" on both: keyed on it alone, a venv or browser build made
      # on one image would be restored on the other. ImageOS (e.g. "ubuntu24") is a
      # runner environment variable, not in the expression `env` context, so it is
      # exported first.
      - name: Expose the runner image for cache keys
        run: echo "RUNNER_IMAGE_OS=${ImageOS:-unknown}" >> "$GITHUB_ENV"

      - name: Cache Pipenv
        uses: actions/cache@v5
        with:
          path: ~/.local/share/virtualenvs
          key: ${{ runner.os }}-${{ env.RUNNER_IMAGE_OS }}-pipenv-${{ hashFiles('**/Pipfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUNNER_IMAGE_OS }}-pipenv-

      - name: Cache NPM
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-${{ env.RUNNER_IMAGE_OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.RUNNER_IMAGE_OS }}-node-

      # For Playwright we use a fixed cache per version
      - name: Get Playwright version (from package.json)
        id: playwright-version
        working-directory: ./frontend
        run: echo "PLAYWRIGHT_VERSION=$(node -p "require('./package.json').devDependencies['@playwright/test'].replace(/[\^~]/g, '')" || echo 'fallback')" >> $GITHUB_ENV

      - name: Cache Playwright Browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ env.RUNNER_IMAGE_OS }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      # ==========================================
      # 3. INSTALLATION & ASSETS BUILD
      # ==========================================
      - name: Install Python Dependencies
        run: pipenv install --dev

      - name: Generate VERSION file for Docker
        # Must run BEFORE any step that could write tracked files: `git describe
        # --dirty` would otherwise stamp the image version with a spurious "-dirty".
        # (Gallery PNGs and the generated API client are gitignored.)
        # The Dockerfile COPYs a VERSION file (gitignored build artifact) so the
        # image can report its version at runtime — the image has no .git/, so
        # git describe cannot run there. Freeze it here on the host (fetch-depth:0
        # gives us tags) reusing the same get_git_version() the app uses.
        run: pipenv run python -c "from pathlib import Path; from backend.app.utils.version import get_git_version; get_git_version.cache_clear(); Path('VERSION').write_text(get_git_version())"

      - name: "[INFO] Environment summary before install"
        run: |
          pwd
          ls -la
          node -v
          npm -v
          python --version
          pipenv --version
          git log -1 --oneline
          git status --short
          node -p "require('./package.json').devDependencies?.['@playwright/test'] || require('./package.json').dependencies?.['@playwright/test'] || 'None'" || true
          node -p "require('./frontend/package.json').devDependencies?.['@playwright/test'] || require('./frontend/package.json').dependencies?.['@playwright/test'] || 'None'" || true
          ls -la ~/.cache/ms-playwright || true
          find ~/.cache/ms-playwright -maxdepth 2 -type d | sort || true

      - name: Install Frontend & Playwright Dependencies (via dev.py)
        timeout-minutes: 15
        run: pipenv run ./dev.py install

      - name: "[INFO] Playwright installation check"
        run: |
          npm --prefix frontend exec -- playwright --version || true

      - name: Build SvelteKit Frontend
        # Essential for the gallery and the Dockerfile which COPYs frontend/build/
        run: pipenv run ./dev.py front build

      - name: Check MkDocs translation structure consistency
        id: check-translate-diff
        continue-on-error: ${{ github.ref_name == 'dev' }}
        run: pipenv run ./dev.py mkdocs translate-diff --issues-only

      - name: Validate broken MkDocs translation links
        id: check-translate-validate
        continue-on-error: ${{ github.ref_name == 'dev' }}
        run: pipenv run ./dev.py mkdocs translate-validate --hide-localized

      - name: Validate cross-boundary links
        id: check-cross-links
        continue-on-error: ${{ github.ref_name == 'dev' }}
        run: pipenv run ./dev.py mkdocs check-links

      - name: Build MkDocs Documentation
        id: build-mkdocs
        # BEFORE the gallery: the Playwright webServer (`dev.py server --test`)
        # serves /mkdocs and builds the 4-language site on startup when site/ is
        # missing — ~40s+ of the webServer start-up budget (120 s then, 300 s since
        # 2026-10-06), which is what made the gallery time out on 2026-09-04 after
        # the docs growth (57 new translated files). With site/ already built, the
        # server starts in seconds.
        continue-on-error: ${{ github.ref_name == 'dev' }}
        run: pipenv run ./dev.py mkdocs build

      - name: Generate Screenshots with Playwright
        id: gallery
        timeout-minutes: 120
        # ubuntu-latest (public repo) runners have 4 vCPU. --workers 8 was 2x
        # oversubscribed, causing heavy CPU contention across Chromium instances
        # + backend uvicorn workers + node build processes — this was the root
        # cause of inconsistent per-test timeouts (a different test would time
        # out on each run). Matched to actual CPU count for stable, predictable
        # per-test timing (verified locally: --workers 2-3 gives a constant,
        # non-degrading ~21s/interaction rate with zero flakiness).
        #
        # Release gate, like the docs checks above: the images bundle the gallery
        # and a release deploys the docs site, so a release must not ship missing
        # or broken screenshots. On dev it stays tolerant: the nightly continues
        # with the screenshots that succeeded, and the report below lists it.
        continue-on-error: ${{ github.ref_name == 'dev' }}
        run: pipenv run ./dev.py mkdocs gallery --workers 4

      - name: Rebuild SvelteKit Frontend (production, for the images)
        # The gallery's Playwright webServer is `dev.py server --test`, which
        # rebuilds frontend/build/ in DEBUG mode (no minification, sourcemaps).
        # The images copy frontend/build/, so it is rebuilt for production here;
        # the Dockerfile's frontend stage refuses a debug build.
        run: pipenv run ./dev.py front build

      - name: Rebuild MkDocs Documentation (with the gallery screenshots)
        id: rebuild-mkdocs
        # The site was built before the gallery (fast webServer start), so it has
        # no screenshots yet. Rebuilt here, the full image ships them; the light
        # image's docs stage strips them again.
        continue-on-error: ${{ github.ref_name == 'dev' }}
        run: pipenv run ./dev.py mkdocs build

      # Nightly (dev) only: surface soft-failed steps as a yellow run banner + a
      # readable summary, instead of a green checkmark that hides them. Release
      # runs keep the hard-fail behaviour (no continue-on-error there).
      - name: Report soft-failed steps (nightly)
        if: ${{ github.ref_name == 'dev' && always() }}
        run: |
          python3 - << 'PYEOF'
          import os

          steps = [
              ("Check MkDocs translation structure consistency", "${{ steps.check-translate-diff.outcome }}"),
              ("Validate broken MkDocs translation links", "${{ steps.check-translate-validate.outcome }}"),
              ("Validate cross-boundary links", "${{ steps.check-cross-links.outcome }}"),
              ("Build MkDocs Documentation", "${{ steps.build-mkdocs.outcome }}"),
              ("Generate Screenshots with Playwright", "${{ steps.gallery.outcome }}"),
              ("Rebuild MkDocs Documentation (with the gallery screenshots)", "${{ steps.rebuild-mkdocs.outcome }}"),
          ]
          failed = [name for name, outcome in steps if outcome == "failure"]
          if not failed:
              print("All soft-gated steps passed.")
              raise SystemExit(0)

          lines = [
              "## ⚠️ Soft-failed steps (nightly continues, release would fail)",
              "",
              "These steps failed but are `continue-on-error` on `dev`:",
              "",
              *[f"- ❌ {name}" for name in failed],
              "",
              "The release pipeline does **not** tolerate these — fix before tagging.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n")
          print(f"::warning title=Soft-failed steps::{len(failed)} docs/gallery step(s) failed — see the job summary")
          PYEOF


      - name: Generate requirements.txt for Docker
        # The Dockerfile installs dependencies from a native requirements.txt
        run: pipenv requirements > requirements.txt

      # ==========================================
      # 4. DOCKER BUILD & PUSH (light and full variants)
      # ==========================================
      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: GHCR Authentication
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags (user guide, "Image Variants"): `latest` is the LIGHT variant; a release
      # publishes the full variant as `X.Y.Z` and the light one as `X.Y.Z-light`;
      # nightlies are `nightly` (full) and `nightly-light`. metadata-action adds
      # `latest` on its own to every `type=semver` release (flavor latest=auto), so
      # the full variant turns it off explicitly — before, both variants pushed
      # `latest` and the light one won only because it was pushed second.
      - name: Extract Docker Metadata (Version)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/librefolio/librefolio
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=nightly,enable=${{ github.ref_name == 'dev' }}
          labels: |
            org.opencontainers.image.title=LibreFolio
            org.opencontainers.image.description=LibreFolio: Open Source Personal Finance & Portfolio Tracker

      # Light variant: the version tag with a "-light" suffix, plus `latest`. The
      # image ships without the documentation images (they load from the online
      # docs site). `latest` moves only on a STABLE release (auto: metadata-action
      # also skips semver prereleases such as 1.2.0-rc.1) and on a manual run from
      # main (the raw tag). A GitHub prerelease publishes only its own tags, even
      # with a plain vX.Y.Z tag. Never `latest=true`: it would add `latest` to every
      # raw tag too (nightly-light included).
      - name: Extract Docker Metadata (Light Variant)
        id: meta-light
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/librefolio/librefolio
          flavor: |
            latest=${{ (github.event_name == 'release' && !github.event.release.prerelease) && 'auto' || 'false' }}
          tags: |
            type=semver,pattern={{version}},suffix=-light
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=nightly-light,enable=${{ github.ref_name == 'dev' }}
          labels: |
            org.opencontainers.image.title=LibreFolio (light)
            org.opencontainers.image.description=LibreFolio (light variant, without documentation images): Open Source Personal Finance & Portfolio Tracker


      # A variant whose metadata yields no tag has nothing documented to publish, and
      # a push without a tag can only fail ("tag is needed when pushing to
      # registry"). That is the full variant on a manual run from main (`latest` is
      # the light one, and the full one is published only as X.Y.Z), and both
      # variants on a manual run from any branch other than dev.
      #
      # The light variant is pushed FIRST. The in-app update prompt shows a release
      # only once its image is pullable, and it checks the plain `X.Y.Z` tag (the
      # full variant, see frontend/src/lib/features/update-check/updateCheck.ts);
      # pushing that tag last means `latest` and `X.Y.Z-light` already exist when
      # the prompt appears. If the light build fails, `X.Y.Z` is never pushed and
      # no admin is told to update to an image they cannot get from `latest`.
      - name: Build and Push Docker Image (Light Variant)
        if: steps.meta-light.outputs.tags != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            DOCS_VARIANT=light
          tags: ${{ steps.meta-light.outputs.tags }}
          labels: ${{ steps.meta-light.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Docker Image
        if: steps.meta.outputs.tags != ''
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ==========================================
      # 5. GITHUB PAGES DEPLOY
      # ==========================================
      - name: Setup Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # The public docs site follows stable releases only (and manual runs from main):
      # a GitHub prerelease never deploys it.
      - name: Deploy to gh-pages branch
        if: github.ref_name == 'main' || (github.event_name == 'release' && !github.event.release.prerelease)
        run: pipenv run ./dev.py mkdocs deploy


      # ==========================================
      # 6. ARTIFACTS (for archival and triage)
      # ==========================================
      # `!cancelled()`: the gallery now fails a release, and a failed run is exactly
      # when the screenshots and the Playwright report are worth having.
      - name: Archive Generated Screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-screenshots
          path: |
            mkdocs_src/docs/gallery/**/*.png
          retention-days: 1
          if-no-files-found: ignore

      # Only when the gallery failed (on dev too, where it is soft): the HTML report
      # with the failure screenshots, error context and the first-retry trace/video.
      - name: Archive Playwright report (gallery failures)
        if: ${{ !cancelled() && steps.gallery.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: playwright-gallery-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 3
          if-no-files-found: ignore


      # ==========================================
      # 7. RELEASE NOTES UPDATE
      # ==========================================
      - name: Append Docker info to Release Notes
        if: github.event.release.tag_name != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          # Images carry metadata-action's {{version}} tags, without the leading "v".
          # `latest` is the light variant; the full one is published only as X.Y.Z.
          # A prerelease does not move `latest`, so its notes have no `latest` line.
          IMAGE_TAG="${TAG_NAME#v}"
          DOCKER_CMD=$(
            printf '\n\n## 📦 Docker Installation\n\n```bash\n'
            if [ "$PRERELEASE" != "true" ]; then
              printf '# Latest release, light variant (documentation screenshots load from the online docs site)\ndocker pull ghcr.io/librefolio/librefolio:latest\n\n'
            fi
            printf '# This release, full variant (documentation fully offline)\ndocker pull ghcr.io/librefolio/librefolio:%s\n\n' "$IMAGE_TAG"
            printf '# This release, light variant\ndocker pull ghcr.io/librefolio/librefolio:%s-light\n```\n' "$IMAGE_TAG"
          )

          # gh CLI has no --notes-append flag: fetch current notes and append manually
          CURRENT_NOTES=$(gh release view "$TAG_NAME" --json body -q .body)
          gh release edit "$TAG_NAME" --notes "${CURRENT_NOTES}${DOCKER_CMD}"

