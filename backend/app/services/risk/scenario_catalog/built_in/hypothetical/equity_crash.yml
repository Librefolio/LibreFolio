schema_version: 1
id: equity_crash
kind: hypothetical_shock
tags: [equity, global]
name:
  en: Equity crash
  it: Crollo azionario
  fr: Krach actions
  es: Caída bursátil
description:
  en: Editable asset-class shocks centered on listed equity exposure.
  it: Shock modificabili per classe di asset concentrati sull'esposizione azionaria quotata.
  fr: Chocs modifiables par classe d'actifs centrés sur l'exposition aux actions cotées.
  es: Choques editables por clase de activo centrados en la exposición a renta variable cotizada.
allowed_dimensions: [asset_class]
defaults:
  dimension: asset_class
  bucket_shocks:
    STOCK: -0.35
    ETF: -0.25
    BOND: -0.02
    CRYPTO: -0.40
    FUND: -0.25
    CROWDFUND: -0.10
    HOLD: 0.0
    COMMODITY: -0.10
    REAL_ESTATE: -0.20
    INDEX: -0.35
    OTHER: 0.0
    # An ETF is shocked as what it holds, so each subtype mirrors its content type.
    # The generic ETF above keeps a blended shock because its content is unstated.
    ETF_STOCK: -0.35
    ETF_BOND: -0.02
    ETF_COMMODITY: -0.10
    ETF_REAL_ESTATE: -0.20
    ETF_CRYPTO: -0.40
    ETF_MONETARY: 0.0
editable:
  dimension: false
  bucket_shocks: true
  manual_overrides: true
limits:
  minimum_shock: -1.0
  maximum_shock: 1.0
  maximum_buckets: 100
