# =============================================================================
# LibreFolio — Production Docker Compose
# =============================================================================
# Optimized for end-users running the official pre-built image from GHCR.
#
# Image variants (version tags have no "v" prefix, e.g. 1.2.3):
#   ghcr.io/librefolio/librefolio:latest        light — the newest release without the
#                                               documentation screenshots (they load from
#                                               the online docs site, so viewing them
#                                               requires an internet connection)
#   ghcr.io/librefolio/librefolio:X.Y.Z         full — a pinned release, screenshots
#                                               included (documentation fully offline)
#   ghcr.io/librefolio/librefolio:X.Y.Z-light   light — a pinned release
# To pin a tag, set LIBREFOLIO_IMAGE in .env to the full reference, e.g.
#   LIBREFOLIO_IMAGE=ghcr.io/librefolio/librefolio:1.2.3   (default: …:latest)
# =============================================================================

services:
  librefolio:
    image: ${LIBREFOLIO_IMAGE:-ghcr.io/librefolio/librefolio:latest}
    container_name: librefolio
    restart: unless-stopped
    ports:
      - "${PORT:-6040}:6040"
    volumes:
      - ./LibreFolio-data:/app/backend/data/prod-docker
    env_file: .env
    environment:
      - LIBREFOLIO_DATA_DIR=/app/backend/data/prod-docker
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6040/api/v1/system/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
