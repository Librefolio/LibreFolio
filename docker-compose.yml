# =============================================================================
# LibreFolio — Docker Compose
# =============================================================================
# Prerequisites:
#   - Copy .env.example to .env and edit parameters:
#       cp .env.example .env
#   - Ensure your user is in the docker group:
#       sudo usermod -aG docker $USER && newgrp docker
#
# Usage:
#   1. Build image:     ./dev.py docker build          (full variant)
#                       ./dev.py docker build --light  (light variant: no docs
#                        images — they load from the online docs site)
#   2. Start:           docker compose up -d
#   3. Access:          http://localhost:${PORT:-6040}
#
# Commands inside the running container (./dev.py docker exec <cmd>):
#   ./dev.py docker exec user list                # user, db and info work
#   ./dev.py docker exec db current
#   The image has no test runner, frontend sources or Node: `test …` answers
#   "not available" and `server --test` cannot start. Run test mode from a
#   source checkout instead (./dev.py server --test, ./dev.py test …).
#   Migrations need no command: the server applies them at every start.
#   See docs: admin/docker_advanced (docker exec).
#
# Light variant: to run the light image via compose, set in .env:
#   LIBREFOLIO_IMAGE=librefolio:latest-light
# =============================================================================

services:
  librefolio:
    image: ${LIBREFOLIO_IMAGE:-librefolio:latest}
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
        # Set DOCS_VARIANT=light to build the light image via compose
        DOCS_VARIANT: ${DOCS_VARIANT:-full}
    container_name: librefolio
    # The container starts as root so the entrypoint can fix bind-mount
    # permissions, then drops to the 'librefolio' user via gosu.
    # (Same pattern as postgres, mysql, redis official images.)
    restart: unless-stopped
    ports:
      - "${PORT:-6040}:6040"
      - "${TEST_PORT:-6041}:6041"
    volumes:
      - ./LibreFolio-data:/app/backend/data/prod-docker
    env_file: .env
    # PRIORITY: 'environment' values below OVERRIDE same-named keys from env_file.
    # These overrides are mandatory inside the container:
    #   - LIBREFOLIO_DATA_DIR must match the container-side bind-mount path.
    #   - HOST must be 0.0.0.0 so the server is reachable from outside the container
    #     (even if the user sets HOST=127.0.0.1 in .env for local development).
    environment:
      - LIBREFOLIO_DATA_DIR=/app/backend/data/prod-docker
      - HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6040/api/v1/system/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

