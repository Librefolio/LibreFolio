<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" name="viewport" />
        <link href="/favicon.png" rel="icon" type="image/png" />
        <link href="/manifest.json" rel="manifest" />
        <link href="/icons/apple-touch-icon.png" rel="apple-touch-icon" sizes="180x180" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="theme-color" content="#1b4334" />
        <link href="/lf-flags.css" rel="stylesheet" />
        <title>LibreFolio</title>
        <script>
            // Anti-FOUC: apply theme class before first paint.
            // Reads 'librefolio-theme' from localStorage (values: 'light' | 'dark' | '' for auto).
            (function () {
                var stored = '';
                try {
                    stored = localStorage.getItem('librefolio-theme') || '';
                } catch (e) {}
                var theme = stored === 'dark' ? 'dark' : stored === 'light' ? 'light' : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.classList.add(theme);
                // PWA title bar: the green sidebar's --lf-surface-bar, the same in both themes (N2, D-T17, D-T24). Kept a pair,
                // so a theme of its own stays one edit away; themeColorMeta.gate.test.ts reads the three copies.
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', theme === 'dark' ? '#1b4334' : '#1b4334');
            })();
            // H-55 v2: the scripts the enforced Content-Security-Policy blocks before the app loads (a proxy's, a CDN's, an
            // extension's), kept for lib/features/security/cspNotice.ts. In its own try, after the theme: never in its way.
            try {
                window.__lfCspViolations = [];
                document.addEventListener('securitypolicyviolation', function (e) {
                    var buffer = window.__lfCspViolations;
                    // Bounded, and stopped once cspNotice.ts drained it (it sets the global to null)
                    if (e.disposition === 'enforce' && Array.isArray(buffer) && buffer.length < 100) buffer.push({directive: e.effectiveDirective, blockedURI: e.blockedURI, sample: e.sample, sourceFile: e.sourceFile});
                });
            } catch (e) {}
            // Early PWA install prompt capture (before Svelte mounts)
            window.addEventListener('beforeinstallprompt', function (e) {
                e.preventDefault();
                window.__pwaInstallPrompt = e;
            });
            // Register Service Worker (offline fallback only)
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js');
            }
        </script>
        <style>
            /* Copies of lib/theme/tokens.css for the splash, which paints before the app's stylesheet loads. Scoped to
               the splash so they never reach the app; themeColorMeta.gate.test.ts checks each --lf-* against
               tokens.css, in both themes */
            #app-splash {
                --lf-surface-page: #f3f5f3;
                --lf-surface-logo: #ffffff;
                --lf-border-subtle: #d8e0dc;
                --lf-focus: #236b4d;
                --lf-shadow-card: color-mix(in oklab, #0d1110 7%, transparent);
            }
            html.dark #app-splash {
                --lf-surface-page: #0d1110;
                --lf-border-subtle: #222c28;
                --lf-focus: #429e79;
                --lf-shadow-card: color-mix(in oklab, #0d1110 40%, transparent);
            }
            #app-splash {
                position: fixed;
                inset: 0;
                z-index: 9999;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                background-color: var(--lf-surface-page);
                transition: opacity 0.3s ease;
            }
            #app-splash.fade-out {
                opacity: 0;
                pointer-events: none;
            }
            .splash-logo {
                width: 80px;
                height: 80px;
                margin-bottom: 24px;
                border-radius: 16px;
                background: var(--lf-surface-logo);
                padding: 8px;
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: 0 2px 8px var(--lf-shadow-card);
            }
            .splash-logo img {
                max-width: 100%;
                max-height: 100%;
                object-fit: contain;
            }
            .splash-spinner {
                width: 36px;
                height: 36px;
                border: 3px solid var(--lf-border-subtle);
                border-top-color: var(--lf-focus);
                border-radius: 50%;
                animation: splash-spin 0.8s linear infinite;
            }
            @keyframes splash-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div id="app-splash">
            <div class="splash-logo"><img alt="LibreFolio" src="/logo.png" /></div>
            <div class="splash-spinner"></div>
        </div>
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
